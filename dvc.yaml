stages:
  generate_data:
    cmd: python src/data/generate_data.py --output data/raw/solar_data.csv
    deps:
      - src/data/generate_data.py
    params:
      - params.yaml:
        - data.n_days
        - data.drift_start_day
    outs:
      - data/raw/solar_data.csv
  
  build_features:
    cmd: python src/data/build_features.py --input data/raw/solar_data.csv --output data/processed/features.csv
    deps:
      - src/data/build_features.py
      - data/raw/solar_data.csv
    outs:
      - data/processed/features.csv
  
  train:
    cmd: python src/train/train.py
    deps:
      - src/train/train.py
      - data/processed/features.csv
    params:
      - params.yaml:
        - train.seq_len
        - train.hidden_size
        - train.num_layers
        - train.dropout
        - train.batch_size
        - train.epochs
        - train.learning_rate
        - train.lr_patience
        - train.lr_factor
        - train.early_stopping_patience
        - train.grad_clip
        - train.test_size
        - train.target_col
        - train.feature_cols
    metrics:
      - metrics.json:
          cache: false
    
  evaluate:
    cmd: python src/evaluate/evaluate.py
    deps:
      - src/evaluate/evaluate.py
      - data/processed/features.csv
    params:
      - params.yaml:
        - evaluate.mape_threshold
        - evaluate.rmse_threshold
        - serving.model_name
        - serving.model_stage
        