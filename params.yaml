data:
  n_days: 730
  drift_start_day: 500
  seed: 42

train:
  # Sequence config
  seq_len: 30            # lookback window: use last 30 days to predict day 31
  test_size: 0.2

  # Model architecture
  input_size: 23         # must match len(feature_cols)
  hidden_size: 64
  num_layers: 2
  dropout: 0.2

  # Training
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  lr_patience: 5         # reduce LR if val loss doesn't improve for 5 epochs
  lr_factor: 0.5
  early_stopping_patience: 10
  grad_clip: 1.0         # prevent exploding gradients

  target_col: daily_revenue_usd
  feature_cols:
    - ghi
    - temperature
    - cloud_cover
    - effective_ghi
    - capacity_factor
    - generation_mwh
    - ppa_price
    - spot_price
    - rec_price
    - curtailment_fraction
    - sin_doy
    - cos_doy
    - month
    - ghi_lag1
    - ghi_lag7
    - generation_lag1
    - generation_lag7
    - spot_price_lag1
    - spot_price_lag7
    - ghi_roll7
    - ghi_roll30
    - spot_price_roll7
    - spot_ppa_ratio

evaluate:
  mape_threshold: 15.0
  rmse_threshold: 5000.0
  fail_on_quality_gate: false

serving:
  model_name: SolarRevenueModel
  model_stage: Production

