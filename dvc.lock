schema: '2.0'
stages:
  generate_data:
    cmd: python src/data/generate_data.py --output data/raw/solar_data.csv
    deps:
    - path: src/data/generate_data.py
      hash: md5
      md5: 39dfa5ffe77d905c7dfd2728963e7c56
      size: 5040
    params:
      params.yaml:
        data.drift_start_day: 500
        data.n_days: 730
    outs:
    - path: data/raw/solar_data.csv
      hash: md5
      md5: 896876ce949d9a3e209c5426e26bef50
      size: 65232
  build_features:
    cmd: python src/data/build_features.py --input data/raw/solar_data.csv 
      --output data/processed/features.csv
    deps:
    - path: data/raw/solar_data.csv
      hash: md5
      md5: 896876ce949d9a3e209c5426e26bef50
      size: 65232
    - path: src/data/build_features.py
      hash: md5
      md5: fa970f709693fceac1c49aa3b1d0b705
      size: 1934
    outs:
    - path: data/processed/features.csv
      hash: md5
      md5: 48478895026a945a2bc159fca4457ec3
      size: 216981
  train:
    cmd: python src/train/train.py
    deps:
    - path: data/processed/features.csv
      hash: md5
      md5: 48478895026a945a2bc159fca4457ec3
      size: 216981
    - path: src/train/train.py
      hash: md5
      md5: 458abd39d66871909f28573adb5aa89b
      size: 12855
    params:
      params.yaml:
        train.batch_size: 32
        train.dropout: 0.2
        train.early_stopping_patience: 10
        train.epochs: 50
        train.feature_cols:
        - ghi
        - temperature
        - cloud_cover
        - effective_ghi
        - capacity_factor
        - generation_mwh
        - ppa_price
        - spot_price
        - rec_price
        - curtailment_fraction
        - sin_doy
        - cos_doy
        - month
        - ghi_lag1
        - ghi_lag7
        - generation_lag1
        - generation_lag7
        - spot_price_lag1
        - spot_price_lag7
        - ghi_roll7
        - ghi_roll30
        - spot_price_roll7
        - spot_ppa_ratio
        train.grad_clip: 1.0
        train.hidden_size: 64
        train.learning_rate: 0.001
        train.lr_factor: 0.5
        train.lr_patience: 5
        train.num_layers: 2
        train.seq_len: 30
        train.target_col: daily_revenue_usd
        train.test_size: 0.2
    outs:
    - path: metrics.json
      hash: md5
      md5: 62957c1c64c44ba0c5e7469cfc95236a
      size: 100
  evaluate:
    cmd: python src/evaluate/evaluate.py
    deps:
    - path: data/processed/features.csv
      hash: md5
      md5: 48478895026a945a2bc159fca4457ec3
      size: 216981
    - path: src/evaluate/evaluate.py
      hash: md5
      md5: 3d296792ae538c64f319b182c65a3f8d
      size: 3198
    params:
      params.yaml:
        evaluate.mape_threshold: 15.0
        evaluate.rmse_threshold: 5000.0
        serving.model_name: SolarRevenueModel
        serving.model_stage: Production
